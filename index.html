<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSO VIP Instructions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pyidaungsu', sans-serif;
        }

        body {
            background: #a2c9f4; /* ပုံထဲကလို အပြာနုရောင် နောက်ခံ */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        /* App Download Section */
        .download-section {
            background: white;
            border: 4px solid #ff4757;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .download-section a {
            color: #ff4757;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Step Section */
        .step-title {
            color: #ff4757;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .img-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .img-card img {
            width: 100%;
            display: block;
        }

        /* Copy Button Styling */
        .copy-info {
            background: black;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .copy-info span {
            color: #ff4757;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="title">KSO VIP</h1>

        <div class="download-section">
            <a href="https://github.com/KYAWSOEOO8/K/releases/download/v1.0.7/kso.vip.vpn.apk">
                APP ဒေါင်းလုတ်လုပ်ပါ
            </a>
        </div>

        <h2 class="step-title">ID ပို့နည်း</h2>

        <div class="image-gallery">
            <div class="img-card">
                <img src="https://raw.githubusercontent.com/KYAWSOEOO8/Box2/refs/heads/main/vip1.jpg" alt="Step 1">
            </div>
            <div class="img-card">
                <img src="https://raw.githubusercontent.com/KYAWSOEOO8/Box2/refs/heads/main/vip2.jpg" alt="Step 2">
            </div>
        </div>

        <div class="copy-info">
            <p><span>VIP စားနှိပ်ပါ</span></p>
            <p>Copy TOKEN စားနှိပ်ပြီး နံပါတ်ပို့ပေးပါ</p>
        </div>
    </div>

</body>
</html>
